id: acl_Pokharel_NeDIOM_Nepali_Idioms
name: Pokharel/NeDIOM-Nepali-Idioms
source_url: https://github.com/pokharel-r/NeDIOM
task: sft/nlp_tasks/idioms_figurative
quality_tier: gold
license: cc-by-4.0
language: ne
split: train
target_rows: 3000

column_mapping:
  idiom: idiom_deva
  meaning: literal_meaning
  sentence: contextual_sentence
  label: figurative_vs_literal

output: dataset/transformed/sft/nlp_tasks/neditom_nepali_idioms.jsonl

export_templates:
  bert:
    format: token_classification
    text: "{contextual_sentence}"
    label: "{figurative_vs_literal}"
  gemma4:
    messages:
      - role: user
        content: "तल दिइएको नेपाली तुक्का/गाउँखाने कथा/मुहावराको अर्थ र भाव स्पष्ट पार्नुहोस्:\nतुक्का: {idiom_deva}\nवाक्य: {contextual_sentence}"
      - role: model
        content: "अर्थ: {literal_meaning}\nभाव: {figurative_vs_literal}"

validation:
  min_devanagari_ratio: 0.75
  drop_duplicates: true
