id: todo_huggingface_Boredoom17_Nepali-Flow-Formal
name: Boredoom17/Nepali-Flow-Formal
source_url: https://huggingface.co/datasets/Boredoom17/Nepali-Flow-Formal
task: sft/nlp_tasks/stylometry_honorifics
quality_tier: gold
license: open
language: ne
split: train
target_rows: 25000
column_mapping:
  text: formal_text
output: dataset/transformed/sft/nlp_tasks/nepali_flow_formal_25k.jsonl
export_templates:
  bert:
    format: language_model_text
    text: '{formal_text}'
validation:
  min_devanagari_ratio: 0.7
  drop_duplicates: true
