id: todo_github_ShubhaPradhan_Nepali-Flickr8k-Dataset
name: ShubhaPradhan/Nepali-Flickr8k-Dataset
source_url: https://github.com/ShubhaPradhan/Nepali-Flickr8k-Dataset
task: multimodal/vision
quality_tier: gold
license: open
language: ne
script: Devanagari

split: train
target_rows: 8000

pipeline_hooks:
  post_process: "toolkit/transforms/hooks.py:enrich_multilingual_metadata"

column_mapping:
  image: image_filename
  caption_nepali: caption

output: dataset/transformed/multimodal/vision/nepali_flickr8k_captions.jsonl

export_templates:
  bert:
    format: language_model_text
    text: "{caption}"
  t5:
    task_prefix: "image captioning nepali: "
    source_text: "{image_filename}"
    target_text: "{caption}"
  gemma4:
    messages:
      - role: "user"
        content: "<image>\nयस तस्बिरको नेपालीमा वर्णन गर्नुहोस्।"
      - role: "model"
        content: "{caption}"

validation:
  min_devanagari_ratio: 0.70
  drop_duplicates: true
