id: todo_github_binayachaudari_Nepali-Tamang-MT-Data
name: binayachaudari/Nepali-Tamang-MT-Data
source_url: https://github.com/binayachaudari/Nepali-Tamang-MT-Data
task: sft/translation
quality_tier: gold
license: open
language: ne
split: train
target_rows: 5000
column_mapping:
  nepali: source_ne
  tamang: target_tam
output: dataset/transformed/sft/translation/binaya_nepali_tamang_5k.jsonl
export_templates:
  t5:
    task_prefix: 'translate nepali to tamang: '
    source_text: '{source_ne}'
    target_text: '{target_tam}'
validation:
  min_devanagari_ratio: 0.7
  drop_duplicates: true
