id: todo_github_Shahil050_romanized_nepali_dataset
name: Shahil050/romanized_nepali_dataset
source_url: https://github.com/Shahil050/romanized_nepali_dataset
task: sft/transliteration
quality_tier: gold
license: open
language: ne
split: train
target_rows: 20000
column_mapping:
  roman: source_roman
  devanagari: target_deva
output: dataset/transformed/sft/translation/shahil_roman_devanagari_20k.jsonl
export_templates:
  t5:
    task_prefix: 'transliterate roman to devanagari: '
    source_text: '{source_roman}'
    target_text: '{target_deva}'
validation:
  min_devanagari_ratio: 0.7
  drop_duplicates: true
