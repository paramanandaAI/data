id: todo_huggingface_chhatramani_Nepal-Legal-Text-Corpus-44laws
name: chhatramani/Nepal-Legal-Text-Corpus-44laws
source_url: https://huggingface.co/datasets/chhatramani/Nepal-Legal-Text-Corpus-44laws
task: sft/domain/legal
quality_tier: gold
license: open
language: ne
split: train
target_rows: 20000
column_mapping:
  law_name: law_title
  section: section_number
  content: text
output: dataset/transformed/sft/domain/legal/nepal_44laws_corpus.jsonl
export_templates:
  bert:
    format: passage_retrieval
    query: '{law_title}'
    passage: '{text}'
  gemma4:
    messages:
    - role: user
      content: नेपालको {law_title} अनुसार दफा {section_number} मा के व्यवस्था छ?
    - role: model
      content: '{text}'
validation:
  min_devanagari_ratio: 0.75
  drop_duplicates: true
