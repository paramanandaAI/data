id: todo_huggingface_chhatramani_Nepali_TTS_55hrs
name: chhatramani/Nepali_TTS_55hrs
source_url: https://huggingface.co/datasets/chhatramani/Nepali_TTS_55hrs
task: multimodal/tts
quality_tier: gold
license: open
language: ne
split: train
target_rows: 25000
column_mapping:
  audio: audio_path
  text: text
  speaker: speaker
output: dataset/transformed/multimodal/tts/nepali_tts_55hrs.jsonl
export_templates:
  t5:
    task_prefix: 'tts synthesize: '
    source_text: '{text}'
    target_text: '{audio_path}'
validation:
  min_devanagari_ratio: 0.7
  drop_duplicates: true
