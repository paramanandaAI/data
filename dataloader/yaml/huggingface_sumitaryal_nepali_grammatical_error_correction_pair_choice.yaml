id: huggingface_sumitaryal_nepali_grammatical_error_correction_pair_choice
name: sumitaryal/nepali_grammatical_error_correction_pair_choice
source_url: https://huggingface.co/datasets/sumitaryal/nepali_grammatical_error_correction
task: sft/gec
quality_tier: gold
license: open
language: ne
script: Devanagari

split: train
target_rows: 5000

column_mapping:
  option_a: sentence_a
  option_b: sentence_b
  correct_option: label

output: dataset/transformed/sft/gec/sumitaryal_pair_choice_5k.jsonl

export_templates:
  bert:
    format: sequence_pair_choice
    text_a: "{sentence_a}"
    text_b: "{sentence_b}"
    label: "{label}"
  t5:
    task_prefix: "choose grammatically correct sentence: "
    source_text: "Option A: {sentence_a} | Option B: {sentence_b}"
    target_text: "{label}"
  gemma4:
    messages:
      - role: "user"
        content: "तलका दुई वाक्यहरूमध्ये कुन वाक्य शुद्ध छ?\nA: {sentence_a}\nB: {sentence_b}"
      - role: "model"
        content: "शुद्ध वाक्य: {label}"

validation:
  min_devanagari_ratio: 0.70
  drop_duplicates: true
