id: todo_huggingface_jangedoo_nepali-nli-20k
name: jangedoo/nepali-nli-20k
source_url: https://huggingface.co/datasets/jangedoo/nepali-nli-20k
task: similarity/nli
quality_tier: gold
license: open
language: ne
split: train
target_rows: 20000
column_mapping:
  premise: premise
  hypothesis: hypothesis
  label: nli_label
output: dataset/transformed/similarity/nli_sts/nepali_nli_20k.jsonl
export_templates:
  bert:
    format: classification_pair
    sentence1: '{premise}'
    sentence2: '{hypothesis}'
    label: '{nli_label}'
validation:
  min_devanagari_ratio: 0.7
  drop_duplicates: true
