id: todo_huggingface_dineshkarki_nepali-sft-dataset
name: dineshkarki/nepali-sft-dataset
source_url: https://huggingface.co/datasets/dineshkarki/nepali-sft-dataset
task: sft/instruction
quality_tier: gold
license: apache-2.0
language: ne
split: train
target_rows: 50000
column_mapping:
  instruction: instruction
  input: input
  output: output
output: dataset/transformed/sft/instruction/dineshkarki_sft_50k.jsonl
export_templates:
  gemma4:
    messages:
    - role: user
      content: '{instruction}

        {input}'
    - role: model
      content: '{output}'
validation:
  min_devanagari_ratio: 0.7
  drop_duplicates: true
