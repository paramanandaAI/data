id: todo_huggingface_jangedoo_stsb_nepali
name: jangedoo/stsb_nepali
source_url: https://huggingface.co/datasets/jangedoo/stsb_nepali
task: similarity/sts
quality_tier: gold
license: open
language: ne
split: train
target_rows: 8000
column_mapping:
  sentence1: sentence_a
  sentence2: sentence_b
  score: similarity_score
output: dataset/transformed/similarity/nli_sts/stsb_nepali_8k.jsonl
export_templates:
  bert:
    format: regression_pair
    sentence1: '{sentence_a}'
    sentence2: '{sentence_b}'
    score: '{similarity_score}'
validation:
  min_devanagari_ratio: 0.7
  drop_duplicates: true
