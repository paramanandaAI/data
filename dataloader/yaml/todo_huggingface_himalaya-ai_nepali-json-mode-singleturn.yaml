id: todo_huggingface_himalaya-ai_nepali-json-mode-singleturn
name: himalaya-ai/nepali-json-mode-singleturn
source_url: https://huggingface.co/datasets/himalaya-ai/nepali-json-mode-singleturn
task: sft/nlp_tasks/structured_output
quality_tier: gold
license: apache-2.0
language: ne
split: train
target_rows: 10000
column_mapping:
  instruction: instruction
  input: input_text
  schema: json_schema
  output: json_output
output: dataset/transformed/sft/nlp_tasks/nepali_json_mode_10k.jsonl
export_templates:
  gemma4:
    messages:
    - role: user
      content: '{instruction}


        Schema:

        {json_schema}


        Data:

        {input_text}'
    - role: model
      content: '{json_output}'
validation:
  min_devanagari_ratio: 0.5
  drop_duplicates: true
