id: huggingface_cfilt_RoundTripOCR-nepali
name: cfilt/RoundTripOCR-nepali
source_url: https://huggingface.co/datasets/cfilt/RoundTripOCR-nepali
task: sft/gec
quality_tier: gold
license: apache-2.0
language: ne
script: Devanagari

split: train
target_rows: 10000

column_mapping:
  noisy_text: input
  clean_text: output

output: dataset/transformed/sft/gec/cfilt_ocr_correction.jsonl

export_templates:
  bert:
    format: sequence_pair
    text_a: "{input}"
    text_b: "{output}"
  t5:
    task_prefix: "ocr post-correction nepali: "
    source_text: "{input}"
    target_text: "{output}"
  gemma4:
    messages:
      - role: "user"
        content: "कृपया तलको OCR त्रुटियुक्त नेपाली पाठलाई शुद्ध बनाउनुहोस्:\n{input}"
      - role: "model"
        content: "{output}"

validation:
  min_devanagari_ratio: 0.70
  drop_duplicates: true
