id: huggingface_ilprl-docse_Nwacha_Muna_A_Newari_ASR_Dataset
name: ilprl-docse/Nwacha_Muna_A_Newari_ASR_Dataset
source_url: https://huggingface.co/datasets/ilprl-docse/Nwacha_Muna_A_Newari_ASR_Dataset
task: multimodal/asr
quality_tier: gold
license: cc-by-4.0
language: new
script: Devanagari

split: train
target_rows: 4575

column_mapping:
  audio: audio_path
  transcription: text

output: dataset/transformed/multimodal/asr/nwacha_muna_newari_asr.jsonl

export_templates:
  bert:
    format: language_model_text
    text: "{text}"
  t5:
    task_prefix: "transcribe newari audio: "
    source_text: "{audio_path}"
    target_text: "{text}"
  gemma4:
    messages:
      - role: "user"
        content: "कृपया दिइएको नेवारी (नेपाल भाषा) अडियोको लिपि रूपान्तरण गर्नुहोस्।"
      - role: "model"
        content: "{text}"

validation:
  min_devanagari_ratio: 0.70
  drop_duplicates: true
