id: ieee_Rauniyar_Nepali_Election_Discourse
name: Rauniyar/Nepali-Election-Discourse-Tweets
source_url: https://github.com/rauniyar-k/nepali-election-discourse
task: sft/domain/crisis_governance
quality_tier: gold
license: open
language: ne
split: train
target_rows: 10000

column_mapping:
  tweet_text: text
  aspect: political_aspect
  sentiment: sentiment_label

output: dataset/transformed/sft/domain/crisis_governance/nepali_election_tweets.jsonl

export_templates:
  bert:
    format: sequence_classification
    text: "{text}"
    label: "{sentiment_label}"
  gemma4:
    messages:
      - role: user
        content: "तल दिइएको राजनीतिक सन्देश वा ट्विटको राजनीतिक पक्ष र दृष्टिकोण विश्लेषण गर्नुहोस्:\nट्विट: {text}"
      - role: model
        content: "मुद्दा/पक्ष: {political_aspect}\nदृष्टिकोण: {sentiment_label}"

validation:
  min_devanagari_ratio: 0.60
  drop_duplicates: true
