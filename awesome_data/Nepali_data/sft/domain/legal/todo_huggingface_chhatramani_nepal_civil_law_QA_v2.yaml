id: todo_huggingface_chhatramani_nepal_civil_law_QA_v2
name: chhatramani/nepal_civil_law_QA_v2
source_url: https://huggingface.co/datasets/chhatramani/nepal_civil_law_QA_v2
task: sft/domain/legal
quality_tier: gold
license: open
language: ne
split: train
target_rows: 10000
column_mapping:
  question: question
  answer: output
  context: context
output: dataset/transformed/sft/domain/legal/nepal_civil_law_qa_v2.jsonl
export_templates:
  t5:
    task_prefix: 'legal qa: '
    source_text: 'सन्दर्भ: {context} | प्रश्न: {question}'
    target_text: '{output}'
  gemma4:
    messages:
    - role: user
      content: 'कानूनी प्रश्न: {question}

        सन्दर्भ: {context}'
    - role: model
      content: '{output}'
validation:
  min_devanagari_ratio: 0.7
  drop_duplicates: true
status: todo
modality: text
size_stats:
  max_rows: 10000
  total_size_mb: null
  download_rows_default: 10000
languages:
  ne: 10000
