id: todo_huggingface_Chhabi_Nepali-Agriculture-QA
name: Chhabi/Nepali-Agriculture-QA
source_url: https://huggingface.co/datasets/Chhabi/Nepali-Agriculture-QA
task: sft/domain/agriculture
quality_tier: gold
license: open
language: ne
split: train
target_rows: 5000
column_mapping:
  question: question
  answer: output
output: dataset/transformed/sft/domain/agriculture/nepali_agriculture_qa_5k.jsonl
export_templates:
  t5:
    task_prefix: 'agriculture query: '
    source_text: '{question}'
    target_text: '{output}'
  gemma4:
    messages:
    - role: user
      content: 'कृषि सम्बन्धी सल्लाह: {question}'
    - role: model
      content: '{output}'
validation:
  min_devanagari_ratio: 0.7
  drop_duplicates: true
status: todo
modality: text
size_stats:
  max_rows: 5000
  total_size_mb: null
  download_rows_default: 5000
languages:
  ne: 5000
