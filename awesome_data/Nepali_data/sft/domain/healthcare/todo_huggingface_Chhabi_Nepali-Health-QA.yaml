id: todo_huggingface_Chhabi_Nepali-Health-QA
name: Chhabi/Nepali-Health-QA
source_url: https://huggingface.co/datasets/Chhabi/Nepali-Health-QA
task: sft/domain/healthcare
quality_tier: gold
license: open
language: ne
split: train
target_rows: 5000
column_mapping:
  question: question
  answer: output
output: dataset/transformed/sft/domain/healthcare/nepali_health_qa_5k.jsonl
export_templates:
  t5:
    task_prefix: 'medical consultation: '
    source_text: '{question}'
    target_text: '{output}'
  gemma4:
    messages:
    - role: user
      content: 'स्वास्थ्य सम्बन्धी प्रश्न: {question}'
    - role: model
      content: '{output}'
validation:
  min_devanagari_ratio: 0.7
  drop_duplicates: true
status: todo
modality: text
size_stats:
  max_rows: 5000
  total_size_mb: null
  download_rows_default: 5000
languages:
  ne: 5000
