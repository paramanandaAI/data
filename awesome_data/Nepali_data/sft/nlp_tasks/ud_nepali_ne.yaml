id: universal_dependencies_nepali_bk
name: universal-dependencies/universal_dependencies (ne_bk - Bhootko Katha)
source_url: https://huggingface.co/datasets/universal-dependencies/universal_dependencies
subset: ne_bk
quality_tier: gold
license: cc-by-sa-4.0
language: ne
script: Devanagari
split: test
target_rows: 50
files:
  surface_generation: lemmatization/sentence_data/ud_nepali/train_surface_generation.jsonl
  sentence_lemmatization: lemmatization/sentence_data/ud_nepali/train_lemmatization.jsonl
tasks:
  - id: sft/surface_realization
    name: Morphological Surface Realization (lemmas + upos + feats -> text)
    file: train_surface_generation.jsonl
  - id: sft/sentence_lemmatization
    name: Sentence Lemmatization Array Output (text -> lemma array)
    file: train_lemmatization.jsonl
export_templates:
  surface_generation:
    system_prompt: 'दिइएका मूल शब्दहरू (Lemmas), पदवर्ग (UPOS), र रूपीय गुणहरू (Features) को आधारमा सही नेपाली वाक्य निर्माण गर्नुहोस्।'
    source_text: '{input}'
    target_text: '{output}'
  sentence_lemmatization:
    system_prompt: 'दिइएको नेपाली वाक्यका शब्दहरूको मूल रूप (Lemma) को सूची (Array) पत्ता लगाउनुहोस्।'
    source_text: '{input}'
    target_text: '{output}'
validation:
  min_devanagari_ratio: 0.7
  drop_duplicates: true
