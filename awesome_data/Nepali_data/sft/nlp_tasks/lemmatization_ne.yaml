id: nepali_sentence_lemmatization
name: Nepali End-to-End Sentence-Level Lemmatization Dataset (CoT & Direct)
task: sft/lemmatization/sentence
quality_tier: gold
license: mit
language: ne
script: Devanagari
split: train
target_rows: 500
output_dir: lemmatization/sentence_data/lemmatization/
files:
  cot_dataset: lemmatization/sentence_data/lemmatization/train_cot.jsonl
  non_cot_dataset: lemmatization/sentence_data/lemmatization/train_non_cot.jsonl
export_templates:
  t5:
    task_prefix: 'lemmatize sentence with reasoning: '
    source_text: '{input}'
    target_text: '{cot}\n\nमूल रूप: {output}'
  gpt:
    system_prompt: 'तल दिइएको नेपाली वाक्यका शब्दहरूको मूल रूप (Lemma) र पदवर्ग विश्लेषण गर्नुहोस्।'
    user_text: '{input}'
    assistant_text: '{cot}\n\nनिष्कर्ष (मूल रूप): {output}'
validation:
  min_devanagari_ratio: 0.8
  drop_duplicates: true
