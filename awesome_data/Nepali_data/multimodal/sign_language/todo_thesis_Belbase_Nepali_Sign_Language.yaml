id: thesis_Belbase_Nepali_Sign_Language
name: Belbase/Nepali-Sign-Language-Dataset
source_url: https://github.com/belbase-s/nepali-sign-language
task: multimodal/sign_language
quality_tier: gold
license: mit
language: ne
split: train
target_rows: 5000
column_mapping:
  image_or_video_path: media_path
  sign_label: devanagari_gloss
  sentence_translation: nepali_sentence
output: dataset/transformed/multimodal/sign_language/nepali_sign_language_5k.jsonl
export_templates:
  gemma4:
    messages:
    - role: user
      content: '<image>

        यस नेपाली सांकेतिक भाषा (Nepali Sign Language) को मुद्रा वा संकेतले कुन शब्द
        वा अर्थ जनाउँछ?'
    - role: model
      content: 'संकेत अर्थ: {devanagari_gloss}

        वाक्य: {nepali_sentence}'
validation:
  min_devanagari_ratio: 0.7
  drop_duplicates: true
status: todo
modality: sign_language
size_stats:
  max_rows: 5000
  total_size_mb: null
  download_rows_default: 5000
languages:
  ne: 5000
