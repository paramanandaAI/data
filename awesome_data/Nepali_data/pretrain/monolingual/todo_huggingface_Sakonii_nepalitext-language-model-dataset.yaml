id: todo_huggingface_Sakonii_nepalitext-language-model-dataset
name: Sakonii/nepalitext-language-model-dataset
source_url: https://huggingface.co/datasets/Sakonii/nepalitext-language-model-dataset
task: pretrain/monolingual
quality_tier: gold
license: open
language: ne
split: train
target_rows: 100000
column_mapping:
  text: text
output: dataset/transformed/pretrain/nepalitext_lm_100k.jsonl
export_templates:
  bert:
    format: language_model_text
    text: '{text}'
  t5:
    task_prefix: 'denoise: '
    source_text: '{text}'
    target_text: '{text}'
  gemma4:
    messages:
    - role: user
      content: 'Continue the following Nepali text:

        {text}'
    - role: model
      content: '{text}'
validation:
  min_devanagari_ratio: 0.7
  drop_duplicates: true
status: todo
modality: text
size_stats:
  max_rows: 100000
  total_size_mb: null
  download_rows_default: 100000
languages:
  ne: 100000
