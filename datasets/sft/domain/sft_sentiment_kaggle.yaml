id: sft_sentiment_kaggle
name: kaggle/nepali-sentiment-analysis
task: sft/domain/sentiment
status: verified
quality_tier: silver
modality: text
license: open
language: ne
script: Devanagari
source_url: https://www.kaggle.com/datasets/sitaula/nepali-sentiment

size_stats:
  max_rows: 35789
  total_size_mb: 11.55
  download_rows_default: 35789

languages:
  ne: 35789

column_mapping:
  Sentences: input
  Sentiment: output

output: data/awesome_data/Nepali_data/sft/domain/sentiment_analysis_nepali_final.csv

export_templates:
  t5:
    task_prefix: "classify sentiment: "
    source_text: "{Sentences}"
    target_text: "{Sentiment}"
  gemma4:
    messages:
      - role: user
        content: "तल दिइएको नेपाली वाक्यको भाव (-१: नकारात्मक, ०: तटस्थ, १: सकारात्मक) विश्लेषण गर्नुहोस्:\n\n{Sentences}"
      - role: assistant
        content: "{Sentiment}"
