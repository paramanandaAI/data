id: todo_github_dahalsweekar_Nepali-Handwritten-Dataset
name: dahalsweekar/Nepali-Handwritten-Dataset-for-Recognition
source_url: https://github.com/dahalsweekar/Nepali-Handwritten-Dataset-for-Recognition
task: multimodal/ocr/handwritten
quality_tier: gold
license: open
language: ne
split: train
target_rows: 10000
column_mapping:
  image_path: image_path
  character: label
output: dataset/transformed/multimodal/ocr/nepali_handwritten_htr_10k.jsonl
export_templates:
  gemma4:
    messages:
    - role: user
      content: '<image>

        यस हस्तलिखित नेपाली वर्णलाई पहिचान गर्नुहोस्।'
    - role: model
      content: '{label}'
validation:
  min_devanagari_ratio: 0.7
  drop_duplicates: false
status: todo
modality: image_text
size_stats:
  max_rows: 10000
  total_size_mb: null
  download_rows_default: 10000
languages:
  ne: 10000
