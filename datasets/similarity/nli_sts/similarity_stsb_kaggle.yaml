id: similarity_stsb_kaggle
name: yubraj11/sentence-similarity-nepali-dataset
task: similarity/nli_sts
status: verified
quality_tier: gold
modality: text
license: open
language: ne
script: Devanagari
source_url: https://www.kaggle.com/datasets/yubraj11/sentence-similarity-nepali-dataset

size_stats:
  max_rows: 5749
  total_size_mb: 1.91
  download_rows_default: 5749

languages:
  ne: 5749

column_mapping:
  sentence1: input_a
  sentence2: input_b
  score: label

output: data/awesome_data/Nepali_data/similarity/nli_sts/stsb_multi_mt_nepali_cleaned.csv

export_templates:
  t5:
    task_prefix: "measure sentence similarity 0 to 5: "
    source_text: "sentence 1: {sentence1} | sentence 2: {sentence2}"
    target_text: "{score}"
  gemma4:
    messages:
      - role: user
        content: "तलका दुई वाक्यबीचको अर्थगत समानता ० देखि ५ को स्केलमा मापन गर्नुहोस्:\nवाक्य १: {sentence1}\nवाक्य २: {sentence2}"
      - role: assistant
        content: "{score}"
