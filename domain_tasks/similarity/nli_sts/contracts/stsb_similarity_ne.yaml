id: kaggle_stsb_multi_mt_nepali_similarity
name: yubraj11/sentence-similarity-nepali-dataset (STS-B Multi-MT Nepali)
source_url: https://www.kaggle.com/datasets/yubraj11/sentence-similarity-nepali-dataset
source_file: lemmatization/other_sources/kaggle/stsb_multi_mt_nepali_cleaned.csv
task: sft/sentence_similarity
quality_tier: gold
license: cc-by-sa-4.0
language: ne
script: Devanagari

split: train
target_rows: 1000

column_mapping:
  sentence1: sentence1
  sentence2: sentence2
  score: score

output: lemmatization/sentence_data/similarity/stsb_batched_similarity_1000.jsonl

export_templates:
  bert:
    format: sequence_pair_regression
    text_a: "{sentence1}"
    text_b: "{sentence2}"
    label: "{score}"
  t5:
    task_prefix: "evaluate nepali sentence similarity (10 pairs): "
    source_text: "{input}"
    target_text: "{output}"
  gemma4:
    messages:
      - role: "user"
        content: "तल दिइएका १० वटा नेपाली वाक्य जोडीहरूको अर्थगत समानता (Semantic Similarity) मूल्याङ्कन गरी प्रत्येक जोडीको समानता अङ्क (० देखि ५ सम्म) प्रदान गर्नुहोस्:\n{input}"
      - role: "model"
        content: "{output}"

validation:
  min_devanagari_ratio: 0.70
  drop_duplicates: true
