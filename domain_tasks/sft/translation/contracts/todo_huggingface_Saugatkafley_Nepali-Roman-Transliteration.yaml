id: todo_huggingface_Saugatkafley_Nepali-Roman-Transliteration
name: Saugatkafley/Nepali-Roman-Transliteration
source_url: https://huggingface.co/datasets/Saugatkafley/Nepali-Roman-Transliteration
task: sft/transliteration
quality_tier: gold
license: mit
language: ne
split: train
target_rows: 50000
column_mapping:
  roman: source_roman
  devanagari: target_deva
output: dataset/transformed/sft/translation/nepali_roman_transliteration_50k.jsonl
export_templates:
  t5:
    task_prefix: 'transliterate roman to devanagari: '
    source_text: '{source_roman}'
    target_text: '{target_deva}'
  gemma4:
    messages:
    - role: user
      content: 'रोमन नेपालीलाई देवनागरी लिपिमा रूपान्तरण गर्नुहोस्:

        {source_roman}'
    - role: model
      content: '{target_deva}'
validation:
  min_devanagari_ratio: 0.8
  drop_duplicates: true
status: todo
modality: text
size_stats:
  max_rows: 50000
  total_size_mb: null
  download_rows_default: 50000
languages:
  ne: 50000
  en: 50000
