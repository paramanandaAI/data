id: mrlbenchmarks_global_piqa_nepali
name: mrlbenchmarks/global-piqa-nonparallel (npi_deva) Nepali Physical Commonsense Reasoning
source_url: https://huggingface.co/datasets/mrlbenchmarks/global-piqa-nonparallel
subset: npi_deva
task: sft/qa
quality_tier: gold
license: cc-by-4.0
language: ne
script: Devanagari
split: test
target_rows: 100
column_mapping:
  prompt: input
  label: label
  solution0: solution0
  solution1: solution1
  correct_solution: output
output: lemmatization/sentence_data/global_piqa/test_piqa.jsonl
export_templates:
  t5:
    task_prefix: 'answer physical commonsense question: '
    source_text: '{input}'
    target_text: '{output}'
  gpt:
    system_prompt: 'तल दिइएको व्यावहारिक प्रश्नको सही उत्तर दिनुहोस्।'
    user_text: '{input}'
    assistant_text: '{output}'
validation:
  min_devanagari_ratio: 0.7
  drop_duplicates: true
