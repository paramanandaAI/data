id: huggingface_Bibek1129_nepali_SQuAD
name: Bibek1129/nepali_SQuAD
source_url: https://huggingface.co/datasets/Bibek1129/nepali_SQuAD
task: sft/qa
quality_tier: gold
license: cc-by-4.0
language: ne
script: Devanagari
split: train
target_rows: 10000
column_mapping:
  context: context
  question: question
  answers: answers
output: dataset/transformed/sft/qa/nepali_squad_10k.jsonl
export_templates:
  bert:
    format: question_answering
    context: '{context}'
    question: '{question}'
    answers: '{answers}'
  t5:
    task_prefix: 'nepali reading comprehension qa: '
    source_text: 'प्रसङ्ग: {context} | प्रश्न: {question}'
    target_text: '{answers}'
  gemma4:
    messages:
    - role: user
      content: 'दिएको सन्दर्भ पढेर प्रश्नको सही उत्तर दिनुहोस्:


        सन्दर्भ: {context}


        प्रश्न: {question}'
    - role: model
      content: '{answers}'
validation:
  min_devanagari_ratio: 0.7
  drop_duplicates: true
status: verified
modality: text
size_stats:
  max_rows: 10000
  total_size_mb: null
  download_rows_default: 10000
languages:
  ne: 10000
