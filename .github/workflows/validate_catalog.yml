name: Validate Dataset Contracts & Catalog

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Validate YAML Contract Syntax
      run: |
        python -c "
        import glob, yaml, sys
        error_count = 0
        for yfile in glob.glob('datasets/**/*.yaml', recursive=True):
            try:
                with open(yfile, 'r', encoding='utf-8') as f:
                    data = yaml.safe_load(f)
                    assert 'id' in data, f'Missing id in {yfile}'
            except Exception as e:
                print(f'Error in {yfile}: {e}')
                error_count += 1
        if error_count > 0:
            sys.exit(1)
        print('All dataset YAML contracts parsed successfully!')
        "
